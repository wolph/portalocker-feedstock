{% set name = "portalocker" %}
{% set version = "4.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7ac85bb2aa3c7873bf2ac72586fc6154afa4671ac786994a16617a6b7ccb3e5e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - python                               # [build_platform != target_platform]
    - cross-python_{{ target_platform }}   # [build_platform != target_platform]
  host:
    - python
    - pip
    - uv-build >=0.11,<1
  run:
    - python
    - pywin32  # [win]

test:
  imports:
    - portalocker
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/wolph/portalocker
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Cross-platform file locking, with Redis, PID-file and bounded-semaphore locks
  doc_url: https://portalocker.readthedocs.io
  dev_url: https://github.com/wolph/portalocker

extra:
  recipe-maintainers:
    - tyrius02
    - sodre
    - wolph
